plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
    maven { name = 'CurseMaven'; url = 'https://cursemaven.com' }
    maven { name = 'CreateMaven'; url = 'https://maven.createmod.net' }
    maven { name = 'IThundXR'; url = 'https://maven.ithundxr.dev/snapshots' }
    maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
    maven { name = 'XaeroMaven'; url = 'https://chocolateminecraft.com/maven' }
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }
}

dependencies {
    // PoliticsMod 0.3 for Minecraft 1.21.1 / NeoForge.
    compileOnly 'curse.maven:politicsmod-1409021:8890598'
    runtimeOnly 'curse.maven:politicsmod-1409021:8890598'

    // Match the user's actual runtime: Create 6.0.10 for Minecraft 1.21.1.
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }

    // Create's Basin classes reference Ponder's API (VirtualBlockEntity, etc.).
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}")

    // OpenUI MC 0.0.11 for Minecraft 1.21.1 / NeoForge.
    // CurseMaven and the CurseForge API are avoided here because some environments
    // receive DNS/403 responses from those endpoints. The official CurseForge CDN
    // hosts the same published jar directly.
    def openUiJar = layout.buildDirectory.file(
        'deps/openui-mc-neoforge-1.21.1-0.0.11.jar'
    )

    implementation files(openUiJar)

    tasks.register('downloadOpenUi') {
        outputs.file(openUiJar)
        doLast {
            File target = openUiJar.get().asFile
            if (target.exists() && target.length() > 100_000) {
                return
            }

            target.parentFile.mkdirs()

            def url = new URL(
                'https://github.com/UpperMoon0/OpenUI-MC/releases/download/v0.0.11/openui-mc-neoforge-1.21.1-0.0.11.jar'
            )
            def connection = url.openConnection()
            connection.setConnectTimeout(30_000)
            connection.setReadTimeout(60_000)
            connection.setUseCaches(false)
            connection.setRequestProperty('User-Agent', 'Gradle/PoliticsEconomy')

            println("Downloading OpenUI MC 0.0.11 from the OpenUI GitHub release...")
            connection.getInputStream().withCloseable { input ->
                target.withOutputStream { output ->
                    input.transferTo(output)
                }
            }

            if (!target.exists() || target.length() < 100_000) {
                throw new GradleException(
                    "OpenUI MC download failed or returned an invalid file: " + target
                )
            }
        }
    }

    tasks.named('compileJava').configure {
        dependsOn 'downloadOpenUi'
    }

    // Optional Xaero's World Map API. Provided by the player's modpack at runtime.
    // 1.40.2+ exposes the element wrapper used by this client-only political overlay.
    compileOnly("xaero.map:xaeroworldmap-common-${minecraft_version}:1.44.2")
    compileOnly("xaero.map:xaeroworldmap-neoforge-${minecraft_version}:1.44.2")
    // Xaero Lib + Minimap element API used by the World Map wrapper.
    compileOnly("xaero.lib:xaerolib-neoforge-\${minecraft_version}:1.7.3")
    compileOnly("xaero.minimap:xaerominimap-neoforge-\${minecraft_version}:26.4.2")

    // Create: Diesel Generators 1.21.1-1.3.15. Used only for the economy integration.
    compileOnly("maven.modrinth:ZM3tt6p1:UoPH8lO1")
    runtimeOnly("maven.modrinth:ZM3tt6p1:UoPH8lO1")
}


processResources {
    def props = [
        mod_id: mod_id,
        mod_name: mod_name,
        mod_version: mod_version,
        mod_license: mod_license,
        minecraft_version_range: minecraft_version_range,
        loader_version_range: loader_version_range,
        description: mod_description
    ]

    inputs.properties props

    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
}

jar {
    manifest {
        attributes([
            'Specification-Title': mod_name,
            'Specification-Version': mod_version,
            'Implementation-Title': mod_name,
            'Implementation-Version': project.version
        ])
    }
}
